name: SSHConfigManager
options:
  bundleIdPrefix: tr.com.mess
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    APP_PRODUCT_NAME: SSH Config Manager
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  SSHConfigKit:
    path: Packages/SSHConfigKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  SSHConfigManager:
    type: application
    platform: macOS
    sources:
      - path: SSHConfigManager
        excludes:
          - Resources/AppIcon.icon
      - path: SSHConfigManager/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: SSHConfigKit
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: SSHConfigManager/Info.plist
      properties:
        CFBundleDisplayName: SSH Config Manager
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        # Sparkle: the appcast lists releases; updates must be signed with the EdDSA key matching SUPublicEDKey
        # (private key in the release Mac's login keychain, account "sshcm"; see docs/design/release.md).
        SUFeedURL: https://raw.githubusercontent.com/messcenter/SSHConfigManager/main/appcast.xml
        SUPublicEDKey: GFXYw2ssANJ5TUQhNXiUmYlg1LCjIEVWVhnmq/Z2ZFE=
        # Localized (en, tr) by SSHConfigManager/Shared/Localization/InfoPlist.xcstrings, built from the sources above.
        NSAppleEventsUsageDescription: SSH Config Manager opens your terminal and runs ssh for the host you choose.
    entitlements:
      path: SSHConfigManager/SSHConfigManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.mess.SSHConfigManager
        PRODUCT_NAME: $(APP_PRODUCT_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Notarization rejects com.apple.security.get-task-allow, which Xcode injects by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  SSHConfigManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SSHConfigManagerTests
    dependencies:
      - target: SSHConfigManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.mess.SSHConfigManagerTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(APP_PRODUCT_NAME).app/Contents/MacOS/$(APP_PRODUCT_NAME)"
schemes:
  SSHConfigManager:
    build:
      targets:
        SSHConfigManager: all
        SSHConfigManagerTests: [test]
    test:
      targets:
        - SSHConfigManagerTests
